name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-dummy-password
          N8N_WEBHOOK_URL=https://example.com/
          N8N_ENCRYPTION_KEY=ci-dummy-32-chars-long-key-1234
          N8N_BASIC_AUTH_PASSWORD=ci-dummy-password
          AI_SERVICES_API_KEY=ci-dummy-key
          EOF

      - name: Validate docker compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Run local pre-deployment checks (non-blocking)
        run: bash scripts/validate-local.sh || true

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          script: |
            set -e
            cd /opt/nexus-engine
            ./scripts/deploy.sh
