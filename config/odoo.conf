[options]
admin_passwd = admin
; Database parameters
; db_host = db
; db_port = 5432
; db_user = odoo
; db_password = odoo_secret
; db_name = nexus_erp
; list_db = False

; Multi-company / multi-worker settings
workers = 4
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 4294967296
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; Proxy / networking
proxy_mode = False
xmlrpc_port = 8069
longpolling_port = 8072

; Addons path
addons_path = /mnt/extra-addons

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_db = False

; Performance / multi-tenancy
osv_memory_count_limit = 0
osv_memory_age_limit = 1
transient_age_limit = 1.0
max_file_upload_size = 134217728

; Session / security
session_gc = 1000
session_timeout = 60*60*24*7
