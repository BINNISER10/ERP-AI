# =============================================================================
# Nexus Reverse Proxy — DEV/TEST mode (self-signed HTTPS, no domain required)
#
# Mirrors the production routing rules but uses a self-signed certificate
# generated by the nginx-cert-init service. This provides a Secure Context so
# modern browser APIs (navigator.clipboard, service workers, etc.) work.
#
# Routing:
#   /                  → Odoo
#   /websocket         → Odoo longpolling
#   /api/v1/*          → AI microservices
#   /erpnext/api/*     → ERPNext backend API only
#   /nexus/*           → Odoo custom controllers
#
# Once a real domain is available, switch to config/nginx.conf (Let's Encrypt).
# =============================================================================

# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# Connection upgrade map (for WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream pools
upstream odoo_backend {
    server odoo:8069;
    keepalive 32;
}

upstream odoo_longpolling {
    server odoo:8072;
    keepalive 8;
}

upstream ai_microservices {
    server ai_services:8000;
    keepalive 16;
}

upstream erpnext_core {
    server erpnext-backend:8000;
    keepalive 16;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS server (self-signed certificate)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ── WebSocket long-polling ──
    location /websocket {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://odoo_longpolling;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── AI microservices (rate-limited) ──
    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://ai_microservices;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_read_timeout 120s;
    }

    # ── ERPNext core API (INTERNAL ONLY — never expose the UI) ──
    location ~ ^/erpnext/api/(resource|method|method/erpnext|method/frappe) {
        proxy_pass http://erpnext_core;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /erpnext;
        proxy_read_timeout 60s;

        if ($request_uri ~ "^/erpnext/(?!api/(resource|method)/)") {
            return 404;
        }
    }

    # ── Login protection ──
    location /web/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
    }

    # ── Nexus-specific controllers (PDF export, chart JSON, IoT bridge) ──
    location /nexus/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
    }

    # ── All other paths → Odoo ──
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── Hide nginx version ──
    server_tokens off;
}
