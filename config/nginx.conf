# =============================================================================
# Nexus Reverse Proxy — Unified gateway for Odoo + ERPNext + AI microservices
#
# Architecture (single domain: erp.example.com):
#
#   /                  → Odoo web client           (HTTPS, main app)
#   /web/*             → Odoo web client           (HTTPS)
#   /websocket         → Odoo longpolling          (HTTP upgrade)
#   /api/v1/*          → AI microservices          (FastAPI)
#   /erpnext/*         → ERPNext backend API only   (NO public UI)
#   /nexus/*           → Odoo controllers          (PDF export, charts, etc.)
#
# The customer only ever sees erp.example.com. The /erpnext/* path is
# strictly an internal proxy — the ERPNext UI is never exposed directly.
#
# Requires environment variables: ODOO_DOMAIN, ACME_EMAIL
# =============================================================================

# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# Connection upgrade map (for WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream pools
upstream odoo_backend {
    server nexus_odoo:8069;
    keepalive 32;
}

upstream odoo_longpolling {
    server nexus_odoo:8072;
    keepalive 8;
}

upstream ai_microservices {
    server nexus_ai:8000;
    keepalive 16;
}

upstream erpnext_core {
    server nexus_erpnext_backend:8000;
    keepalive 16;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect (with ACME challenge passthrough)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${ODOO_DOMAIN} _;

    # ACME challenge must remain on port 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers even on the redirect
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS server
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${ODOO_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${ODOO_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ODOO_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${ODOO_DOMAIN}/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 100m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ── WebSocket long-polling ──
    location /websocket {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://odoo_longpolling;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── AI microservices (rate-limited) ──
    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://ai_microservices;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_read_timeout 120s;
    }

    # ── ERPNext core API (INTERNAL ONLY — never expose the UI) ──
    # Only specific API endpoints are proxied. Anything else returns 404.
    location ~ ^/erpnext/api/(resource|method|method/erpnext|method/frappe) {
        # Strip the /erpnext prefix so ERPNext sees a clean URL.
        proxy_pass http://erpnext_core;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /erpnext;
        proxy_read_timeout 60s;
        # Reject anything outside the allowed API prefixes
        if ($request_uri ~ "^/erpnext/(?!api/(resource|method)/)") {
            return 404;
        }
    }

    # ── Login protection ──
    location /web/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
    }

    # ── Nexus-specific controllers (PDF export, chart JSON) ──
    location /nexus/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
    }

    # ── All other paths → Odoo ──
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── Hide nginx version ──
    server_tokens off;
}
